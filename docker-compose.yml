version: '3.8'

services:
  # --- SERVICIO 1: BASE DE DATOS (MySQL) ---
  mysqldb:
    image: mysql:8.0
    container_name: task-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskdb
    ports:
      # Mapeo: Puerto de PC (3307) -> Puerto del contenedor (3306)      
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # --- SERVICIO 2: ALMACENAMIENTO (MinIO) ---
  minio:
    image: minio/minio
    container_name: task-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API 
      - "9001:9001" # Consola Web 
    volumes:
      - minio-data:/data

  # --- SERVICIO 3: APP (Solo para despliegue futuro) ---
  task-api:
    build: .
    container_name: task-api-container
    depends_on:
      - mysqldb
      - minio
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/taskdb?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      CONFIG_S3_ENDPOINT: http://minio:9000
      CONFIG_S3_ACCESS_KEY: minioadmin
      CONFIG_S3_SECRET_KEY: minioadmin
      CONFIG_S3_BUCKET_NAME: task-bucket

volumes:
  mysql-data:
  minio-data: